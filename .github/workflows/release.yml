name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos-linux:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build macOS (DMG) and Linux
        run: >
          go tool mygo build
          -skip-installer
          -platform darwin/arm64,darwin/amd64,linux/amd64,linux/arm64
      - name: Collect installers
        run: |
          set -e
          mkdir -p release
          cp dist/darwin-arm64/*.dmg release/
          cp dist/darwin-amd64/*.dmg release/
          cp dist/linux-amd64/*.deb release/
          cp dist/linux-amd64/*-linux-amd64.tar.gz release/
          cp dist/linux-arm64/*.deb release/
          cp dist/linux-arm64/*-linux-arm64.tar.gz release/
          ls -lh release
      - name: Checksums
        run: |
          cd release
          shasum -a 256 * > checksums.txt
          cat checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: macos-linux
          path: release/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build Windows installers
        run: go tool mygo build -platform windows/amd64,windows/arm64
      - name: Collect installers
        shell: bash
        run: |
          set -e
          mkdir -p release
          cp dist/windows-amd64/script-manager-setup-*.exe release/
          cp dist/windows-arm64/script-manager-setup-*.exe release/
          ls -lh release
      - name: Checksums
        shell: bash
        run: |
          cd release
          sha256sum * > checksums.txt
          cat checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*

  publish:
    needs: [macos-linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect files and merge checksums
        run: |
          set -e
          mkdir -p out
          cp artifacts/macos-linux/* out/
          cp artifacts/windows/* out/
          cd out
          rm -f checksums.txt
          sha256sum * > checksums.txt
          cat checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
