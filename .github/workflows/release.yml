name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos-linux:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build macOS and Linux
        run: >
          go tool mygo build
          -skip-dmg
          -skip-installer
          -platform darwin/arm64,darwin/amd64,linux/amd64
      - name: Archive
        run: |
          set -e
          mkdir -p release
          for d in dist/darwin-*/; do
            [ -d "$d/script-manager.app" ] || continue
            (cd "$d" && zip -qry "../../release/$(basename "$d").zip" "script-manager.app")
          done
          for d in dist/linux-*/; do
            tar -czf "release/$(basename "$d").tar.gz" -C "$d" .
          done
          ls -l release
      - name: Checksums
        run: |
          cd release
          shasum -a 256 * > checksums-macos-linux.txt
          cat checksums-macos-linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: macos-linux
          path: release/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build Windows with installer
        run: go tool mygo build -platform windows/amd64
      - name: Checksums
        shell: bash
        run: |
          cd dist/windows-amd64
          rm -f checksums-windows.txt
          sha256sum script-manager*.exe > checksums-windows.txt
          cat checksums-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/windows-amd64/script-manager*.exe
            dist/windows-amd64/checksums-windows.txt

  publish:
    needs: [macos-linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect files and merge checksums
        run: |
          set -e
          mkdir -p out
          cp artifacts/macos-linux/* out/
          cp artifacts/windows/* out/
          cd out
          rm -f checksums-macos-linux.txt checksums-windows.txt
          # Every published file, one line each, so the app can verify what it
          # downloads (see updater.go: checksumFor).
          sha256sum * > checksums.txt
          cat checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
