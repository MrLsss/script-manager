name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# mygo build signs the update archives and manifests with this key, and
# uploads them to the draft release with the GitHub CLI.
env:
  MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  macos-linux:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Check that mygo.json matches the tag
        run: test "v$(jq -r .version mygo.json)" = "$GITHUB_REF_NAME"
      - name: Build, sign and upload macOS and Linux
        run: >
          go tool mygo build
          -skip-installer
          -platform darwin/arm64,darwin/amd64,linux/amd64,linux/arm64
          -upload

  windows:
    # The macOS and Linux job creates the draft release first, so that the
    # two builds do not try to create it at once.
    needs: macos-linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build, sign and upload Windows
        run: go tool mygo build -platform windows/amd64,windows/arm64 -upload

  publish:
    needs: [macos-linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the release
        run: |
          set -e
          tag="v$(jq -r .version mygo.json)"
          assets="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for f in \
            update-darwin-arm64.json update-darwin-amd64.json \
            update-windows-arm64.json update-windows-amd64.json \
            update-linux-arm64.json update-linux-amd64.json; do
            grep -qx "$f" <<< "$assets" || { echo "missing $f"; exit 1; }
          done
          # Installed apps see the update once the draft is published.
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
